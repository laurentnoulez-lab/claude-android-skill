name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["claude/**"]
    paths:
      - "app/**"
      - ".github/workflows/build-*.yml"

# La console des exécuteurs Windows est en cp1252 : les caractères affichés par
# flet (rich) provoquent alors une UnicodeEncodeError. On force l'UTF-8 et la
# sortie non interactive.
env:
  PYTHONIOENCODING: "utf-8"
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"
  VERSION: "1.0.0"

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installateur:
    name: Installateur Windows
    # windows-latest embarque Visual Studio 2026, que Flutter 3.29.2 ne détecte
    # pas : il retombe sur le générateur CMake « Visual Studio 16 2019 », absent
    # de la machine. VS 2022 est celui que cette version de Flutter sait utiliser.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.2"
          channel: stable
          cache: true

      - name: Installer flet
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]==0.28.3"

      - name: Construire l'application
        working-directory: app
        shell: pwsh
        run: |
          chcp 65001 | Out-Null
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          flet build windows `
            --project HydroBassin `
            --product HydroBassin `
            --org be.hydrobassin `
            --company HydroBassin `
            --copyright "HydroBassin" `
            --build-version $env:VERSION `
            --build-number ${{ github.run_number }} `
            --verbose

      - name: Identifier l'exécutable produit
        id: exe
        working-directory: app
        shell: pwsh
        run: |
          $exe = Get-ChildItem build/windows -Filter *.exe -Recurse |
                 Where-Object { $_.DirectoryName -eq (Resolve-Path build/windows).Path } |
                 Select-Object -First 1
          if (-not $exe) { throw "Aucun exécutable trouvé dans build/windows" }
          Write-Host "Exécutable : $($exe.Name)"
          "nom=$($exe.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Get-ChildItem build/windows | Select-Object Name, Length | Format-Table

      - name: Installer Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /? | Select-Object -First 2

      - name: Compiler l'installeur
        working-directory: app/packaging/windows
        shell: pwsh
        run: |
          $source = (Resolve-Path ../../build/windows).Path
          $sortie = Join-Path $env:GITHUB_WORKSPACE "livrables"
          New-Item -ItemType Directory -Force -Path $sortie | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DSourceDir=$source" `
            "/DExeName=${{ steps.exe.outputs.nom }}" `
            "/DMaVersion=$env:VERSION" `
            "/DOutputDir=$sortie" `
            hydrobassin.iss
          Get-ChildItem $sortie | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: HydroBassin-installateur-windows
          path: livrables/*.exe
          if-no-files-found: error

      - name: Publier dans la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: livrables/*.exe
