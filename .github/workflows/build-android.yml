name: Build APK Android

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["claude/**"]
    paths:
      - "app/**"
      - ".github/workflows/build-*.yml"

env:
  FLET_CLI_NO_RICH_OUTPUT: "1"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.2"
          channel: stable
          cache: true

      - name: Installer flet
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]==0.28.3"

      - name: flutter doctor
        run: flutter doctor -v

      - name: Construire l'APK
        working-directory: app
        run: |
          flet build apk \
            --project HydroBassinPlus \
            --product "HydroBassin+" \
            --org be.hydrobassin \
            --bundle-id be.hydrobassin.hydrobassinplus \
            --company HydroBassin \
            --copyright "HydroBassin" \
            --build-version 3.0.0 \
            --build-number ${{ github.run_number }} \
            --verbose

      - name: Renommer l'APK
        working-directory: app
        run: |
          mkdir -p ../livrables
          find build -name "*.apk" -exec cp {} ../livrables/HydroBassinPlus-3.0.0.apk \;
          ls -la ../livrables

      # L'identifiant du paquet ne se relit nulle part ailleurs : ni le journal
      # de compilation ni l'application ne le montrent. C'est pourtant lui qui
      # décide si le téléphone propose d'installer HydroBassin+ ou de mettre à
      # jour HydroBassin. On le relit donc dans l'APK produit.
      - name: Vérifier l'identité du paquet
        run: |
          set -euo pipefail
          aapt=$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/build-tools" \
                      -name aapt2 -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$aapt" ]; then
            echo "::error::aapt2 introuvable : l'identité du paquet n'a pas pu être vérifiée."
            exit 1
          fi
          badging=$("$aapt" dump badging livrables/HydroBassinPlus-3.0.0.apk)
          echo "$badging" | head -3
          attendu="be.hydrobassin.hydrobassinplus"
          ancien="be.hydrobassin.hydrobassin"
          if ! echo "$badging" | grep -qF "package: name='$attendu'"; then
            echo "::error::identifiant inattendu — HydroBassin+ doit s'installer à côté de la 2.0.0, pas la remplacer."
            echo "$badging" | grep "^package:" || true
            exit 1
          fi
          if echo "$badging" | grep -qF "package: name='$ancien'"; then
            echo "::error::l'identifiant de la 2.0.0 est revenu : installer écraserait l'application précédente."
            exit 1
          fi
          if ! echo "$badging" | grep -qF "application-label:'HydroBassin+'"; then
            echo "::error::le nom affiché ne distingue pas les deux applications sur l'écran d'accueil."
            echo "$badging" | grep "application-label" || true
            exit 1
          fi
          echo "Identité vérifiée : $attendu, affiché « HydroBassin+ »."

      - uses: actions/upload-artifact@v4
        with:
          name: HydroBassinPlus-apk
          path: livrables/*.apk
          if-no-files-found: error

      - name: Publier dans la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: livrables/*.apk
