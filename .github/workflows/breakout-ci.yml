name: Breakout CI

on:
  push:
    branches: [main]
    paths:
      - 'breakout/**'
      - '.github/workflows/breakout-ci.yml'
  pull_request:
    paths:
      - 'breakout/**'
      - '.github/workflows/breakout-ci.yml'
  workflow_dispatch:

jobs:
  build:
    name: Tests + APK debug
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: breakout
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitaires du moteur
        run: ./gradlew test --stacktrace

      - name: Compilation de l'APK debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Publication de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: breakout-debug-apk
          path: breakout/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
