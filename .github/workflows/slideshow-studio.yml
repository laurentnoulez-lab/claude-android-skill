name: Slideshow Studio

# The example app carries the only executable code in this repository: its engine test suite is what
# protects the visual guarantees (no distortion, no jump, no frozen photo) from future changes.
on:
  push:
    branches: [main]
    paths:
      - 'examples/slideshow-studio/**'
      - '.github/workflows/slideshow-studio.yml'
  pull_request:
    paths:
      - 'examples/slideshow-studio/**'
      - '.github/workflows/slideshow-studio.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: examples/slideshow-studio

jobs:
  engine-tests:
    name: Engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run the engine test suite
        run: ./gradlew :core:engine:test

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-report
          path: examples/slideshow-studio/core/engine/build/reports/tests/test
          if-no-files-found: ignore

  android-build:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble the debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload the APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: slideshow-studio-debug
          path: examples/slideshow-studio/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
