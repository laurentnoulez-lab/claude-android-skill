name: Windows EXE

on:
  push:
    branches: [ "claude/trench-template-automation-6gcqnk" ]
    paths:
      - 'desktop/**'
      - 'app/**'
      - 'gabarit-tranchees-impetrants.html'
      - '.github/workflows/windows-exe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild single-file web app
        run: python app/build.py

      - name: Copy web app into desktop shell
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/app | Out-Null
          Copy-Item gabarit-tranchees-impetrants.html desktop/app/index.html -Force

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build NSIS installer
        working-directory: desktop
        run: npm run dist

      - name: Empreintes SHA-256
        shell: pwsh
        working-directory: desktop/dist
        run: |
          Get-ChildItem -File -Path GabaritTranchees-*.exe,GabaritTranchees-*.zip |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}  ({2:N0} octets)" -f $_.Hash, (Split-Path $_.Path -Leaf), (Get-Item $_.Path).Length } |
            Tee-Object -FilePath SHA256SUMS.txt

      - name: Copie de l'application autonome (secours sans installation)
        shell: pwsh
        run: Copy-Item gabarit-tranchees-impetrants.html desktop/dist/ -Force

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: gabarit-tranchees-windows-setup
          path: |
            desktop/dist/GabaritTranchees-Setup-*.exe
            desktop/dist/GabaritTranchees-portable-*.zip
            desktop/dist/SHA256SUMS.txt
            desktop/dist/gabarit-tranchees-impetrants.html
          if-no-files-found: error
