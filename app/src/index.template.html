    <span class="logo" aria-hidden="true"><!--__LOGO__--></span>
    <div class="brand-txt">
      <h1>Gabarit Tranchées <span class="vbadge">2.0</span></h1>
      <div class="sub">Tranchées communes impétrants · <button type="button" id="btn-about" class="linklike" title="À propos de cette version">v__APP_VERSION__ · __APP_DATE_FR__</button></div>
    </div>

  <div class="pname">
    <label for="pname">Projet</label>

    </div>
    <div class="tgroup">
      <button type="button" id="btn-import" class="ghost" title="Ouvrir un fichier projet .json">Importer</button>
      <button type="button" id="btn-export" class="ghost" title="Enregistrer le projet en fichier .json">Exporter</button>
    </div>
    <div class="tgroup">
      <button type="button" id="btn-print" class="ghost" title="Imprimer ou enregistrer en PDF">Imprimer</button>
      <button type="button" id="btn-word" class="ghost" title="Notice Word avec les coupes">Word</button>
      <button type="button" id="btn-excel" class="primary" title="Classeur Excel avec formules">Générer Excel</button>
    </div>
  </div>
  <input type="file" id="file-import" accept=".json,application/json" style="display:none">
</header>
